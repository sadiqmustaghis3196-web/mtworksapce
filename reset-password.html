<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Set New Password — MT Nexus Global Enterprise ERP</title>

  <!-- Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/theme.css">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--board-bg, #14104a);
      background-image: var(--board-grid-pattern);
      background-size: 32px 32px, 32px 32px, 100% 100%, 100% 100%;
      background-attachment: fixed;
      color: var(--tx, #F5F6FA);
      font-family: var(--font-sans);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      overflow-x: hidden;
      position: relative;
    }

    .ambient-glow-1 {
      position: absolute;
      top: -120px;
      left: 15%;
      width: 480px;
      height: 480px;
      background: radial-gradient(circle, rgba(109, 59, 210, 0.28) 0%, transparent 70%);
      pointer-events: none;
      filter: blur(40px);
      z-index: 0;
    }

    .ambient-glow-2 {
      position: absolute;
      bottom: -100px;
      right: 15%;
      width: 440px;
      height: 440px;
      background: radial-gradient(circle, rgba(25, 195, 230, 0.22) 0%, transparent 70%);
      pointer-events: none;
      filter: blur(40px);
      z-index: 0;
    }

    .login-container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 460px;
      margin: 0 auto;
    }

    .brand-header {
      text-align: center;
      margin-bottom: 24px;
    }

    .brand-logo-card {
      display: inline-block;
      padding: 8px 18px;
      background: rgba(28, 30, 48, 0.75);
      border: 1px solid rgba(25, 195, 230, 0.3);
      border-radius: 14px;
      backdrop-filter: blur(12px);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
      margin-bottom: 16px;
    }

    .brand-logo-img {
      height: 52px;
      width: auto;
      object-fit: contain;
      display: block;
    }

    .brand-title {
      font-family: var(--font-display);
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.02em;
      background: var(--grad);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 6px;
    }

    .login-card {
      background: rgba(28, 30, 48, 0.88);
      border: 1px solid var(--bd, #343750);
      border-radius: 18px;
      padding: 36px 32px;
      box-shadow: 0 16px 48px rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(16px);
      position: relative;
      overflow: hidden;
    }

    .login-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: var(--grad);
    }

    .card-heading {
      font-family: var(--font-display);
      font-size: 20px;
      font-weight: 700;
      color: #fff;
      margin-bottom: 8px;
    }

    .card-subheading {
      font-size: 13px;
      color: var(--mu, #8993AC);
      margin-bottom: 24px;
      line-height: 1.5;
    }

    .alert-banner {
      display: none;
      align-items: flex-start;
      gap: 10px;
      padding: 12px 14px;
      border-radius: 8px;
      font-size: 13px;
      line-height: 1.4;
      margin-bottom: 20px;
    }

    .alert-banner.error {
      display: flex;
      background: rgba(229, 72, 77, 0.14);
      border: 1px solid rgba(229, 72, 77, 0.45);
      color: #ff9498;
    }

    .alert-banner.success {
      display: flex;
      background: rgba(18, 163, 127, 0.14);
      border: 1px solid rgba(18, 163, 127, 0.45);
      color: #38e2b8;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #d8deeb;
      margin-bottom: 8px;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-icon {
      position: absolute;
      left: 14px;
      color: var(--mu, #8993AC);
      pointer-events: none;
    }

    .form-input {
      width: 100%;
      height: 46px;
      padding: 0 42px 0 42px;
      background: rgba(20, 22, 37, 0.85);
      border: 1px solid var(--bd, #343750);
      border-radius: 10px;
      color: #fff;
      font-size: 14px;
      outline: none;
      transition: all var(--transition-fast);
    }

    .form-input:focus {
      border-color: var(--cy, #19c3e6);
      box-shadow: 0 0 0 3px rgba(25, 195, 230, 0.18);
    }

    .toggle-password-btn {
      position: absolute;
      right: 12px;
      background: transparent;
      border: none;
      color: var(--mu, #8993AC);
      cursor: pointer;
      padding: 6px;
      display: flex;
      align-items: center;
    }

    .toggle-password-btn:hover {
      color: #fff;
    }

    /* Strength checklist */
    .strength-box {
      margin-top: 6px;
      margin-bottom: 18px;
      padding: 10px 12px;
      background: rgba(20, 22, 37, 0.6);
      border: 1px solid var(--bd, #343750);
      border-radius: 8px;
      font-size: 11px;
    }

    .strength-title {
      font-weight: 600;
      color: var(--mu, #8993AC);
      margin-bottom: 6px;
    }

    .strength-item {
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--mu, #8993AC);
      margin-bottom: 3px;
    }

    .strength-item.valid {
      color: var(--ok, #12a37f);
    }

    .submit-btn {
      width: 100%;
      height: 48px;
      background: var(--grad);
      color: #fff;
      font-family: var(--font-display);
      font-size: 15px;
      font-weight: 700;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: 0 4px 18px rgba(109, 59, 210, 0.4);
      transition: all var(--transition-fast);
    }

    .submit-btn:hover:not(:disabled) {
      background: var(--brand-gradient-hover);
      transform: translateY(-1px);
    }

    .submit-btn:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }

    .btn-spinner {
      display: none;
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .back-row {
      text-align: center;
      margin-top: 24px;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--cy, #19c3e6);
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
    }

    .back-link:hover {
      text-decoration: underline;
    }

    .login-footer {
      text-align: center;
      margin-top: 24px;
      font-size: 12px;
      color: var(--mu, #8993AC);
    }

    @media (max-width: 480px) {
      body {
        padding: 24px 12px;
      }
      .brand-title {
        font-size: 22px;
      }
      .login-card {
        padding: 24px 16px;
        border-radius: 14px;
      }
      .card-heading {
        font-size: 18px;
      }
      .form-input {
        font-size: 13px;
        height: 44px;
      }
      .submit-btn {
        height: 44px;
      }
    }

    @media (max-width: 360px) {
      body {
        padding: 16px 8px;
      }
      .login-card {
        padding: 20px 12px;
      }
    }
  </style>
</head>
<body>

  <div class="ambient-glow-1"></div>
  <div class="ambient-glow-2"></div>

  <div class="login-container">
    <div class="brand-header">
      <div class="brand-logo-card">
        <img src="assets/logo.jpg" alt="MT Nexus Global" class="brand-logo-img">
      </div>
      <h1 class="brand-title">MT NEXUS GLOBAL</h1>
    </div>

    <div class="login-card">
      <h2 class="card-heading">Set New Password</h2>
      <p class="card-subheading" id="token-status-text">Validating your one-time reset link…</p>

      <div id="alert-banner" class="alert-banner" role="alert">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="8" x2="12" y2="12"></line>
          <line x1="12" y1="16" x2="12.01" y2="16"></line>
        </svg>
        <span id="alert-text">Message</span>
      </div>

      <form id="reset-form" onsubmit="handleResetSubmit(event)" style="display: none;" novalidate>
        <div class="form-group">
          <label for="password-input" class="form-label">New Password</label>
          <div class="input-wrapper">
            <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
            <input 
              type="password" 
              id="password-input" 
              class="form-input" 
              placeholder="••••••••••••" 
              required 
              oninput="checkPasswordStrength(this.value)"
            >
            <button type="button" class="toggle-password-btn" onclick="togglePasswordVisibility('password-input')">
              👁️
            </button>
          </div>
        </div>

        <!-- Strength Requirements -->
        <div class="strength-box">
          <div class="strength-title">Password Requirements:</div>
          <div class="strength-item" id="req-length"><span>○</span> At least 8 characters</div>
          <div class="strength-item" id="req-upper"><span>○</span> One uppercase letter</div>
          <div class="strength-item" id="req-lower"><span>○</span> One lowercase letter</div>
          <div class="strength-item" id="req-number"><span>○</span> One number or special character</div>
        </div>

        <div class="form-group">
          <label for="confirm-password-input" class="form-label">Confirm New Password</label>
          <div class="input-wrapper">
            <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
            <input 
              type="password" 
              id="confirm-password-input" 
              class="form-input" 
              placeholder="••••••••••••" 
              required
            >
            <button type="button" class="toggle-password-btn" onclick="togglePasswordVisibility('confirm-password-input')">
              👁️
            </button>
          </div>
        </div>

        <button type="submit" id="submit-btn" class="submit-btn">
          <span class="btn-spinner" id="btn-spinner"></span>
          <span id="btn-text">Confirm & Reset Password</span>
        </button>
      </form>

      <div class="back-row">
        <a href="login.html" class="back-link">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
          </svg>
          Return to Sign In
        </a>
      </div>
    </div>

    <div class="login-footer">
      <span>MT Nexus Global ERP &copy; 2026. All rights reserved.</span>
    </div>
  </div>

  <script src="js/auth.js"></script>
  <script>
    let resetToken = null;

    function showAlert(message, type = 'error') {
      const banner = document.getElementById('alert-banner');
      const text = document.getElementById('alert-text');
      banner.className = `alert-banner ${type}`;
      text.textContent = message;
      banner.style.display = 'flex';
    }

    function togglePasswordVisibility(id) {
      const el = document.getElementById(id);
      el.type = el.type === 'password' ? 'text' : 'password';
    }

    function checkPasswordStrength(val) {
      const isLength = val.length >= 8;
      const isUpper = /[A-Z]/.test(val);
      const isLower = /[a-z]/.test(val);
      const isNumber = /[0-9!@#$%^&*]/.test(val);

      setReq('req-length', isLength);
      setReq('req-upper', isUpper);
      setReq('req-lower', isLower);
      setReq('req-number', isNumber);
    }

    function setReq(id, valid) {
      const el = document.getElementById(id);
      if (valid) {
        el.className = 'strength-item valid';
        el.querySelector('span').textContent = '●';
      } else {
        el.className = 'strength-item';
        el.querySelector('span').textContent = '○';
      }
    }

    document.addEventListener('DOMContentLoaded', async () => {
      const params = new URLSearchParams(window.location.search);
      resetToken = params.get('token');

      const statusText = document.getElementById('token-status-text');
      const resetForm = document.getElementById('reset-form');

      if (!resetToken) {
        statusText.textContent = 'Invalid Request';
        showAlert('No reset token was provided in the link. Please request a new password reset.', 'error');
        return;
      }

      try {
        const verifyRes = await window.auth.verifyResetToken(resetToken);
        if (verifyRes.success && verifyRes.valid) {
          statusText.textContent = `Resetting password for ${verifyRes.email}`;
          resetForm.style.display = 'block';
        } else {
          statusText.textContent = 'Link Expired or Invalid';
          showAlert(verifyRes.message || 'This password reset link is invalid, expired, or has already been used.', 'error');
        }
      } catch (err) {
        statusText.textContent = 'Verification Error';
        showAlert('Failed to connect to authentication server.', 'error');
      }
    });

    async function handleResetSubmit(e) {
      e.preventDefault();
      const password = document.getElementById('password-input').value;
      const confirmPassword = document.getElementById('confirm-password-input').value;

      if (password !== confirmPassword) {
        showAlert('Passwords do not match. Please verify both fields.');
        return;
      }

      if (password.length < 8) {
        showAlert('Password must be at least 8 characters long.');
        return;
      }

      const submitBtn = document.getElementById('submit-btn');
      const btnText = document.getElementById('btn-text');
      const spinner = document.getElementById('btn-spinner');

      submitBtn.disabled = true;
      btnText.textContent = 'Updating Password…';
      spinner.style.display = 'inline-block';

      try {
        const res = await window.auth.resetPassword(resetToken, password, confirmPassword);
        submitBtn.disabled = false;
        btnText.textContent = 'Confirm & Reset Password';
        spinner.style.display = 'none';

        if (res.success) {
          showAlert('Password has been successfully updated! Redirecting to Sign In…', 'success');
          document.getElementById('reset-form').style.display = 'none';
          setTimeout(() => {
            window.location.href = 'login.html';
          }, 1500);
        } else {
          showAlert(res.message || 'Failed to reset password.', 'error');
        }
      } catch (err) {
        submitBtn.disabled = false;
        btnText.textContent = 'Confirm & Reset Password';
        spinner.style.display = 'none';
        showAlert('Network error occurred. Please try again.');
      }
    }
  </script>
</body>
</html>
